name: DailyBlogLabo Morning Edition

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST = 00:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tab: [devlog, ai, crypto, stocks, hot]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Generate ${{ matrix.tab }} AM edition
        run: npx tsx scripts/generate.ts --tab=${{ matrix.tab }} --edition=am
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}

      - name: Commit and push
        run: |
          git config user.name "DailyBlogLabo Bot"
          git config user.email "bot@dailybloglabo.dev"
          git add content/ public/images/
          git diff --staged --quiet || git commit -m "pulse: $(date +%Y-%m-%d) ${{ matrix.tab }} AM"
          git pull --rebase
          git push
